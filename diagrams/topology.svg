<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Two-site enterprise network topology</title>
<desc>An internet server at 198.51.100.10 sits behind the ISP router at 203.0.113.1. The ISP connects to HQ-R1 over 203.0.113.0/30. HQ-R1 links to BR-R1 over the WAN 10.0.0.0/30 and to the HQ-CORE layer 3 switch over 10.1.0.0/30. HQ-CORE trunks to HQ-ACC1 (staff and guest PCs) and HQ-ACC2 (server and staff PC). BR-R1 trunks to BR-ACC1 with a staff PC and a guest PC.</desc>
<style>
.t{font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
.s{font-size:12px;text-anchor:middle;dominant-baseline:central}
.lbl{font-size:12px;fill:#444441;dominant-baseline:central}
.ln{fill:none;stroke:#5F5E5A;stroke-width:1}
.site{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:5 4}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.75}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.75}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.75}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
</style>
<rect width="680" height="560" fill="#FFFFFF"/>
<rect class="site" x="10" y="120" width="345" height="410" rx="16"/>
<rect class="site" x="395" y="120" width="260" height="410" rx="16"/>
<text class="t" x="182" y="512" fill="#2C2C2A">HQ site, 10.1.0.0/16</text>
<text class="t" x="525" y="512" fill="#2C2C2A">Branch site, 10.2.0.0/16</text>
<line class="ln" x1="255" y1="55" x2="310" y2="55"/>
<line class="ln" x1="180" y1="80" x2="180" y2="140"/>
<text class="lbl" x="190" y="100">203.0.113.0/30</text>
<line class="ln" x1="255" y1="165" x2="445" y2="165"/>
<text class="lbl" x="375" y="104" text-anchor="middle">WAN link 10.0.0.0/30</text>
<line x1="375" y1="112" x2="375" y2="160" stroke="#888780" stroke-width="0.75" stroke-dasharray="3 3"/>
<line class="ln" x1="180" y1="190" x2="180" y2="240"/>
<text class="lbl" x="190" y="215">10.1.0.0/30</text>
<line class="ln" x1="520" y1="190" x2="520" y2="240"/>
<text class="lbl" x="530" y="215">Trunk</text>
<path class="ln" d="M180 290 V315 H93 V340"/>
<path class="ln" d="M180 315 H265 V340"/>
<text class="lbl" x="275" y="315">Trunks</text>
<path class="ln" d="M520 290 V315 H476 V340"/>
<path class="ln" d="M520 315 H596 V340"/>
<path class="ln" d="M93 390 V415 H54 V440"/>
<path class="ln" d="M93 415 H132 V440"/>
<path class="ln" d="M265 390 V415 H228 V440"/>
<path class="ln" d="M265 415 H308 V440"/>
<g class="gray"><rect x="105" y="30" width="150" height="50" rx="8"/><text class="t" x="180" y="47">ISP router</text><text class="s" x="180" y="65">203.0.113.1</text></g>
<g class="gray"><rect x="310" y="30" width="150" height="50" rx="8"/><text class="t" x="385" y="47">Internet server</text><text class="s" x="385" y="65">198.51.100.10</text></g>
<g class="purple"><rect x="105" y="140" width="150" height="50" rx="8"/><text class="t" x="180" y="157">HQ-R1</text><text class="s" x="180" y="175">Edge, OSPF, NAT</text></g>
<g class="purple"><rect x="445" y="140" width="150" height="50" rx="8"/><text class="t" x="520" y="157">BR-R1</text><text class="s" x="520" y="175">Router-on-a-stick</text></g>
<g class="teal"><rect x="105" y="240" width="150" height="50" rx="8"/><text class="t" x="180" y="257">HQ-CORE</text><text class="s" x="180" y="275">Layer 3 switch</text></g>
<g class="teal"><rect x="445" y="240" width="150" height="50" rx="8"/><text class="t" x="520" y="257">BR-ACC1</text><text class="s" x="520" y="275">Access switch</text></g>
<g class="teal"><rect x="28" y="340" width="130" height="50" rx="8"/><text class="t" x="93" y="357">HQ-ACC1</text><text class="s" x="93" y="375">Access switch</text></g>
<g class="teal"><rect x="200" y="340" width="130" height="50" rx="8"/><text class="t" x="265" y="357">HQ-ACC2</text><text class="s" x="265" y="375">Access switch</text></g>
<g class="gray"><rect x="440" y="340" width="72" height="50" rx="6"/><text class="t" x="476" y="357">Staff PC</text><text class="s" x="476" y="375">VLAN 10</text></g>
<g class="gray"><rect x="560" y="340" width="72" height="50" rx="6"/><text class="t" x="596" y="357">Guest PC</text><text class="s" x="596" y="375">VLAN 20</text></g>
<g class="gray"><rect x="18" y="440" width="72" height="50" rx="6"/><text class="t" x="54" y="457">Staff PC</text><text class="s" x="54" y="475">VLAN 10</text></g>
<g class="gray"><rect x="96" y="440" width="72" height="50" rx="6"/><text class="t" x="132" y="457">Guest PC</text><text class="s" x="132" y="475">VLAN 20</text></g>
<g class="gray"><rect x="192" y="440" width="72" height="50" rx="6"/><text class="t" x="228" y="457">Server</text><text class="s" x="228" y="475">VLAN 30</text></g>
<g class="gray"><rect x="272" y="440" width="72" height="50" rx="6"/><text class="t" x="308" y="457">Staff PC</text><text class="s" x="308" y="475">VLAN 10</text></g>
</svg>
